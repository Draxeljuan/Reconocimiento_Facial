services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rf_backend
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/database.db}
      - FACE_MATCH_THRESHOLD=${FACE_MATCH_THRESHOLD:-0.6}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Volumen local persistente para el motor embebido SQLite (database.db)
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - reconocimiento_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rf_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LAN_IP=${LAN_IP:-}
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      # Certificados SSL/TLS autofirmados generados y persistidos localmente para la LAN
      - ./certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - reconocimiento_net

networks:
  reconocimiento_net:
    driver: bridge
