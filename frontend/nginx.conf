# Redirección automática HTTP (80) -> HTTPS (443) para forzar contexto seguro WebRTC (RNF02)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

# Servidor Principal HTTPS (SPA Estática + Reverse-Proxy hacia Backend FastAPI)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Permitir cargas multiparte de múltiples fotografías desde cámaras móviles
    client_max_body_size 20M;

    # Cabeceras de seguridad y habilitación explícita de cámara WebRTC para el propio origen
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    # Raíz de la aplicación cliente SPA
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-Proxy unificado bajo /api/* -> http://backend:8000/*
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_request_buffering off;
    }

    # Rutas directas equivalentes para compatibilidad total con clientes REST externos
    location ~ ^/(inferencia|registro|usuarios|health)$ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_request_buffering off;
    }

    # Servir recursos estáticos de la SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
